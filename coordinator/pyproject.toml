[project]
name = "coordinator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hung-Chun Tseng", email = "alan.tseng.cs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.2",
    "uvicorn>=0.30",
]

[project.scripts]
coordinator = "coordinator:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
